name: flutter_endless_runner
description: 无尽跑酷 - 支持 Android、Windows 与 Web 三平台的 Flame 无尽跑酷游戏
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.13.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: 1.38.2
  flame_audio: 2.12.2
  go_router: 17.3.0
  provider: 6.1.5+1
  shared_preferences: 2.5.6
  nes_ui: 0.30.0
  google_fonts: 6.3.3
  logging: 1.3.0
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flame_test: 2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/dash/
    - assets/images/enemies/
    - assets/images/scenery/
    - assets/music/
    - assets/sfx/
  fonts:
    - family: Press Start 2P
      fonts:
        - asset: assets/fonts/Press_Start_2P/PressStart2P-Regular.ttf
